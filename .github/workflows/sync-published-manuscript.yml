name: Sync published manuscript

on:
  push:
    paths:
      - ".github/workflows/sync-published-manuscript.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download published Zenodo PDF and verify it
        shell: bash
        run: |
          set -euo pipefail
          PDF="Yonezu_2026_Randomization_Collapses_Idle_Start_Memory_Barrier.pdf"
          curl --fail --location --retry 3 \
            "https://zenodo.org/records/22643897/files/${PDF}?download=1" \
            -o "${PDF}.tmp"
          echo "0534a7e963b5979d8b0b73d94941f618  ${PDF}.tmp" | md5sum -c -
          mv "${PDF}.tmp" "${PDF}"

      - name: Insert published paper DOI into TeX source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("paper.tex")
          text = path.read_text(encoding="utf-8")
          old = r"\date{September 7, 2026\\\small Preprint -- not peer reviewed}"
          new = r"\date{September 7, 2026\\\small Preprint -- not peer reviewed\\\small Paper DOI: \href{https://doi.org/10.5281/zenodo.22643897}{10.5281/zenodo.22643897}}"

          if new in text:
              pass
          elif old in text:
              text = text.replace(old, new, 1)
          else:
              raise SystemExit("Expected pre-DOI date line not found in paper.tex")

          path.write_text(text, encoding="utf-8")
          PY
          grep -F 'Paper DOI: \href{https://doi.org/10.5281/zenodo.22643897}{10.5281/zenodo.22643897}' paper.tex
          git diff --check

      - name: Commit synchronized manuscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Yonezu_2026_Randomization_Collapses_Idle_Start_Memory_Barrier.pdf paper.tex
          if git diff --cached --quiet; then
            echo "Already synchronized."
            exit 0
          fi
          git commit -m "Sync manuscript with published Zenodo DOI"
          git push origin HEAD:main
